<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Homelab mesh access architecture</title>
  <desc id="desc">A laptop reaches the home server directly over a self-hosted Tailscale mesh, while a phone running only a DPI-bypass tunnel reaches it through the same VPS, which is itself now a mesh peer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#86efac"/>
    </marker>
    <style>
      .card{fill:url(#panel);stroke:#334155;stroke-width:2;filter:url(#shadow)}
      .soft{fill:#0b1220;stroke:#263244;stroke-width:2}
      .title{font:700 32px Inter,Arial,sans-serif;fill:#f8fafc}
      .subtitle{font:500 16px Inter,Arial,sans-serif;fill:#94a3b8}
      .label{font:700 20px Inter,Arial,sans-serif;fill:#f8fafc}
      .small{font:500 14px Inter,Arial,sans-serif;fill:#cbd5e1}
      .tiny{font:600 12px Inter,Arial,sans-serif;fill:#93c5fd;text-transform:uppercase;letter-spacing:.08em}
      .wire{fill:none;stroke:#7dd3fc;stroke-width:4;stroke-linecap:round;stroke-dasharray:10 10;marker-end:url(#arrow)}
      .wire2{fill:none;stroke:#86efac;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow2)}
      .wireL{fill:none;stroke:#7dd3fc;stroke-width:4;stroke-linecap:round;stroke-dasharray:10 10}
      .wire2L{fill:none;stroke:#86efac;stroke-width:4;stroke-linecap:round}
      .link{fill:none;stroke:#475569;stroke-width:3;stroke-linecap:round}
      .chip{fill:#111827;stroke:#334155;stroke-width:1.5}
      .hot{fill:#111827;stroke:url(#accent);stroke-width:2.5}
      .glow{fill:url(#accent);opacity:.16}
    </style>
  </defs>

  <rect width="1200" height="760" rx="32" fill="url(#bg)"/>
  <circle class="glow" cx="610" cy="390" r="280"/>
  <circle class="glow" cx="1000" cy="160" r="170"/>

  <text x="70" y="70" class="title">Reaching the Homelab From Anywhere</text>
  <text x="70" y="102" class="subtitle">One self-hosted mesh · two ways in · one VPN app on the phone</text>

  <!-- Laptop -->
  <rect class="card" x="70" y="150" width="270" height="145" rx="22"/>
  <text x="205" y="188" text-anchor="middle" class="tiny">device, away from home</text>
  <text x="205" y="222" text-anchor="middle" class="label">Laptop</text>
  <text x="205" y="248" text-anchor="middle" class="small">Tailscale client,</text>
  <text x="205" y="270" text-anchor="middle" class="small">joined to the mesh directly</text>

  <!-- Phone -->
  <rect class="card" x="70" y="460" width="270" height="145" rx="22"/>
  <text x="205" y="498" text-anchor="middle" class="tiny">device, away from home</text>
  <text x="205" y="532" text-anchor="middle" class="label">Phone</text>
  <text x="205" y="558" text-anchor="middle" class="small">DPI-bypass tunnel only —</text>
  <text x="205" y="580" text-anchor="middle" class="small">one VPN slot, no Tailscale app</text>

  <!-- VPS -->
  <rect class="card" x="470" y="195" width="285" height="370" rx="22"/>
  <text x="612" y="232" text-anchor="middle" class="tiny">self-hosted · poland</text>
  <text x="612" y="266" text-anchor="middle" class="label">VPS</text>

  <rect class="chip" x="502" y="292" width="220" height="42" rx="21"/>
  <text x="612" y="318" text-anchor="middle" class="small">headscale control plane</text>
  <rect class="chip" x="502" y="346" width="220" height="42" rx="21"/>
  <text x="612" y="372" text-anchor="middle" class="small">self-hosted DERP relay</text>
  <rect class="chip" x="502" y="400" width="220" height="42" rx="21"/>
  <text x="612" y="426" text-anchor="middle" class="small">DPI-bypass tunnel endpoint</text>
  <rect class="hot" x="502" y="454" width="220" height="60" rx="21"/>
  <text x="612" y="478" text-anchor="middle" class="small">now also a mesh</text>
  <text x="612" y="500" text-anchor="middle" class="small">peer itself</text>

  <!-- Home server -->
  <rect class="card" x="880" y="195" width="250" height="165" rx="22"/>
  <text x="1005" y="232" text-anchor="middle" class="tiny">home · behind CGNAT</text>
  <text x="1005" y="266" text-anchor="middle" class="label">Archcraft</text>
  <text x="1005" y="294" text-anchor="middle" class="small">stable mesh address,</text>
  <text x="1005" y="316" text-anchor="middle" class="small">one door for both paths</text>

  <!-- Services -->
  <rect class="soft" x="880" y="450" width="250" height="95" rx="18"/>
  <text x="1005" y="482" text-anchor="middle" class="tiny">private services</text>
  <text x="1005" y="508" text-anchor="middle" class="small">NFS · nginx (.lab) · Navidrome</text>

  <path class="link" d="M1005 360 L1005 450"/>
  <text x="1020" y="410" class="small">serves</text>

  <!-- Wires -->
  <path class="wire" d="M340 222 C 405 222 405 285 470 285"/>
  <path class="wire2" d="M340 532 C 405 532 405 500 470 500"/>
  <path class="wire" d="M755 290 C 818 290 818 265 880 265"/>
  <path class="wire2" d="M755 478 C 830 478 830 322 880 322"/>

  <!-- Legend -->
  <path class="wireL" d="M70 682 H130"/>
  <text x="142" y="687" class="small">WireGuard mesh — direct when possible, relayed via the self-hosted DERP when not</text>
  <path class="wire2L" d="M70 714 H130"/>
  <text x="142" y="719" class="small">Hysteria2 tunnel — QUIC-based, built to survive DPI</text>
</svg>
