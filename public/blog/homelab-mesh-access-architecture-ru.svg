<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Схема доступа к домашнему серверу через mesh</title>
  <desc id="desc">Ноутбук подключается к домашнему серверу напрямую через self-hosted mesh на базе Tailscale, а телефон, у которого активен только туннель для обхода DPI, доходит до него через тот же VPS — он теперь тоже участник mesh.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#86efac"/>
    </marker>
    <style>
      .card{fill:url(#panel);stroke:#334155;stroke-width:2;filter:url(#shadow)}
      .soft{fill:#0b1220;stroke:#263244;stroke-width:2}
      .title{font:700 30px Inter,Arial,sans-serif;fill:#f8fafc}
      .subtitle{font:500 16px Inter,Arial,sans-serif;fill:#94a3b8}
      .label{font:700 20px Inter,Arial,sans-serif;fill:#f8fafc}
      .small{font:500 14px Inter,Arial,sans-serif;fill:#cbd5e1}
      .tiny{font:600 12px Inter,Arial,sans-serif;fill:#93c5fd;text-transform:uppercase;letter-spacing:.06em}
      .wire{fill:none;stroke:#7dd3fc;stroke-width:4;stroke-linecap:round;stroke-dasharray:10 10;marker-end:url(#arrow)}
      .wire2{fill:none;stroke:#86efac;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow2)}
      .chip{fill:#111827;stroke:#334155;stroke-width:1.5}
      .glow{fill:url(#accent);opacity:.16}
    </style>
  </defs>

  <rect width="1200" height="760" rx="32" fill="url(#bg)"/>
  <circle class="glow" cx="600" cy="390" r="300"/>
  <circle class="glow" cx="1000" cy="160" r="170"/>

  <text x="70" y="70" class="title">Доступ к домашнему серверу отовсюду</text>
  <text x="70" y="102" class="subtitle">Self-hosted mesh, туннель для обхода DPI и телефон с одним слотом под VPN</text>

  <!-- Ноутбук -->
  <rect class="card" x="70" y="150" width="270" height="150" rx="22"/>
  <text x="205" y="188" text-anchor="middle" class="tiny">устройство не дома</text>
  <text x="205" y="222" text-anchor="middle" class="label">Ноутбук</text>
  <text x="205" y="248" text-anchor="middle" class="small">клиент Tailscale,</text>
  <text x="205" y="270" text-anchor="middle" class="small">напрямую в mesh</text>

  <!-- Телефон -->
  <rect class="card" x="70" y="460" width="270" height="150" rx="22"/>
  <text x="205" y="498" text-anchor="middle" class="tiny">устройство не дома</text>
  <text x="205" y="532" text-anchor="middle" class="label">Телефон</text>
  <text x="205" y="558" text-anchor="middle" class="small">только туннель для DPI —</text>
  <text x="205" y="580" text-anchor="middle" class="small">один слот VPN, без Tailscale</text>

  <!-- VPS -->
  <rect class="card" x="465" y="255" width="290" height="340" rx="22"/>
  <text x="610" y="292" text-anchor="middle" class="tiny">self-hosted, Польша</text>
  <text x="610" y="325" text-anchor="middle" class="label">VPS: control plane + шлюз</text>

  <rect class="chip" x="500" y="350" width="220" height="42" rx="21"/>
  <text x="610" y="376" text-anchor="middle" class="small">control plane headscale</text>
  <rect class="chip" x="500" y="404" width="220" height="42" rx="21"/>
  <text x="610" y="430" text-anchor="middle" class="small">свой DERP-релей</text>
  <rect class="chip" x="500" y="458" width="220" height="42" rx="21"/>
  <text x="610" y="484" text-anchor="middle" class="small">точка входа туннеля для DPI</text>
  <rect class="chip" x="500" y="512" width="220" height="60" rx="21"/>
  <text x="610" y="536" text-anchor="middle" class="small">теперь ещё и сам</text>
  <text x="610" y="558" text-anchor="middle" class="small">участник mesh</text>

  <!-- Домашний сервер -->
  <rect class="card" x="880" y="255" width="250" height="200" rx="22"/>
  <text x="1005" y="292" text-anchor="middle" class="tiny">дома, за CGNAT</text>
  <text x="1005" y="325" text-anchor="middle" class="label">Archcraft</text>
  <text x="1005" y="352" text-anchor="middle" class="small">постоянный адрес в mesh,</text>
  <text x="1005" y="374" text-anchor="middle" class="small">доступен любым из путей</text>

  <rect class="soft" x="880" y="480" width="250" height="86" rx="18"/>
  <text x="1005" y="510" text-anchor="middle" class="tiny">приватные сервисы</text>
  <text x="1005" y="536" text-anchor="middle" class="small">NFS · nginx (.lab) · Navidrome</text>

  <!-- Ноутбук -> VPS: mesh напрямую или через DERP -->
  <path class="wire" d="M340 225 C 400 225 400 300 465 320"/>
  <text x="352" y="205" class="small">WireGuard mesh</text>
  <text x="352" y="333" class="small">(напрямую или через DERP)</text>

  <!-- Телефон -> VPS: туннель для обхода DPI -->
  <path class="wire2" d="M340 535 C 400 535 400 480 465 465"/>
  <text x="352" y="608" class="small">туннель Hysteria2</text>
  <text x="352" y="630" class="small">(QUIC, устойчив к DPI)</text>

  <!-- VPS -> домашний сервер: один mesh-сегмент для обоих путей -->
  <path class="wire" d="M755 370 C 815 370 820 355 880 350"/>
  <text x="765" y="410" class="small">WireGuard mesh</text>
  <text x="765" y="430" class="small">(100.64.0.0/10)</text>

  <path class="wire2" d="M755 500 C 815 500 820 500 880 495"/>
</svg>
