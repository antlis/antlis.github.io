  <line x1="260" y1="44" x2="340" y2="44" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>

  <!-- GitHub -->
  <rect x="180" y="64" width="240" height="54" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="300" y="88" font-family="system-ui, sans-serif" font-size="15" fill="#f8fafc" text-anchor="middle" font-weight="600">GitHub</text>
  <text x="300" y="106" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">antlis.github.io</text>

  <!-- Arrow -->
  <line x1="300" y1="118" x2="300" y2="152" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="294,149 300,160 306,149" fill="#f59e0b"/>
  <rect x="312" y="132" width="72" height="18" rx="4" fill="#1e293b"/>
  <text x="348" y="145" font-family="monospace" font-size="10" fill="#f59e0b" text-anchor="middle">MDX files</text>

  <!-- antlis-mcp -->
  <rect x="180" y="162" width="240" height="54" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="300" y="186" font-family="system-ui, sans-serif" font-size="16" fill="#f59e0b" text-anchor="middle" font-weight="700">antlis-mcp</text>
  <text x="300" y="204" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Vercel Function</text>

  <!-- Arrow -->
  <line x1="300" y1="216" x2="300" y2="250" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="294,247 300,258 306,247" fill="#f59e0b"/>
  <rect x="312" y="232" width="44" height="18" rx="4" fill="#1e293b"/>
