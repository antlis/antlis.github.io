<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура воспроизведения tg-streaming-bot</title>
  <desc id="desc">Группа в Telegram отправляет боту команды. Бот скачивает медиа через yt-dlp и перекодирует через ffmpeg, затем ассистент-аккаунт под управлением py-tgcalls пушит один стрим в групповой голосовой чат, где все друзья смотрят вместе. Опциональный Reality-VPN sidecar туннелирует и сигналинг, и голосовой UDP.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
    <style>
      .box { fill: url(#panel); stroke: #334155; stroke-width: 2; }
      .accent { fill: #0b1220; stroke: #1e40af; stroke-width: 2; }
      .chip { fill: #111827; stroke: #475569; stroke-width: 1.5; }
      .label { font: 700 24px Inter, ui-sans-serif, system-ui, sans-serif; fill: #e5eefb; }
      .sub { font: 500 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #94a3b8; }
      .mono { font: 500 17px ui-monospace, "DejaVu Sans Mono", monospace; fill: #cbd5e1; }
      .line { stroke: #22d3ee; stroke-width: 2.5; fill: none; }
      .return { stroke: #a78bfa; stroke-width: 2.5; fill: none; stroke-dasharray: 6 6; }
      .tiny { font: 600 15px Inter, ui-sans-serif, sans-serif; fill: #22d3ee; }
      .tinyp { font: 600 15px Inter, ui-sans-serif, sans-serif; fill: #a78bfa; }
    </style>
  </defs>

  <rect x="6" y="6" width="1188" height="608" rx="34" fill="url(#bg)"/>

  <!-- Telegram group -->
  <g>
    <rect x="60" y="110" width="262" height="150" rx="22" class="box"/>
    <text x="191" y="158" text-anchor="middle" class="label">Группа в Telegram</text>
    <text x="191" y="186" text-anchor="middle" class="sub">ты + друзья</text>
    <rect x="86" y="206" width="210" height="40" rx="12" class="chip"/>
    <text x="191" y="232" text-anchor="middle" class="mono">/vplay &lt;фильм&gt;</text>
  </g>

  <!-- Sources -->
  <g>
    <rect x="60" y="300" width="262" height="120" rx="22" class="box"/>
    <text x="191" y="344" text-anchor="middle" class="label">Источники</text>
    <text x="191" y="374" text-anchor="middle" class="sub">YouTube · радио · IPTV</text>
    <text x="191" y="398" text-anchor="middle" class="sub">файлы · живой m3u8</text>
  </g>

  <!-- tg-streaming-bot -->
  <g>
    <rect x="422" y="96" width="300" height="384" rx="26" class="box"/>
    <rect x="456" y="132" width="232" height="60" rx="16" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <text x="572" y="170" text-anchor="middle" class="label">tg-streaming-bot</text>
    <text x="572" y="222" text-anchor="middle" class="sub">Python + Pyrogram</text>
    <rect x="458" y="252" width="228" height="46" rx="14" class="chip"/>
    <text x="572" y="281" text-anchor="middle" class="mono">yt-dlp + ffmpeg</text>
    <rect x="458" y="314" width="228" height="46" rx="14" class="chip"/>
    <text x="572" y="343" text-anchor="middle" class="mono">радио / IPTV</text>
    <rect x="458" y="376" width="228" height="46" rx="14" class="chip"/>
    <text x="572" y="405" text-anchor="middle" class="mono">py-tgcalls → ассистент</text>
  </g>

  <!-- Group voice chat -->
  <g>
    <rect x="850" y="118" width="280" height="150" rx="22" class="box"/>
    <text x="990" y="166" text-anchor="middle" class="label">Голосовой чат</text>
    <text x="990" y="194" text-anchor="middle" class="sub">один общий стрим</text>
    <text x="990" y="228" text-anchor="middle" class="sub">аудио + видео</text>
  </g>

  <!-- Watch together -->
  <g>
    <rect x="850" y="322" width="280" height="150" rx="22" class="box"/>
    <text x="990" y="370" text-anchor="middle" class="label">Смотрят вместе</text>
    <text x="990" y="398" text-anchor="middle" class="sub">телефон · десктоп</text>
    <text x="990" y="432" text-anchor="middle" class="sub">синхронно, любой город</text>
  </g>

  <!-- Reality-VPN sidecar -->
  <g>
    <rect x="410" y="506" width="380" height="82" rx="20" class="accent"/>
    <text x="600" y="540" text-anchor="middle" class="tinyp">Reality-VPN sidecar (опционально)</text>
    <text x="600" y="568" text-anchor="middle" class="sub">туннелирует сигналинг + голос UDP</text>
  </g>

  <!-- arrows -->
  <path class="line" d="M322 180 H400" marker-end="url(#arrow)"/>
  <text x="360" y="168" text-anchor="middle" class="tiny">команды</text>

  <path class="line" d="M322 358 H400" marker-end="url(#arrow)"/>
  <text x="360" y="346" text-anchor="middle" class="tiny">загрузка</text>

  <path class="line" d="M722 190 H840" marker-end="url(#arrow)"/>
  <text x="781" y="178" text-anchor="middle" class="tiny">стрим py-tgcalls</text>

  <path class="line" d="M990 268 V314" marker-end="url(#arrow)"/>
  <text x="1052" y="298" text-anchor="middle" class="tiny">вживую</text>

  <path class="return" d="M600 480 V500" marker-end="url(#arrowP)"/>
  <text x="618" y="496" text-anchor="start" class="tinyp">трафик</text>
</svg>
