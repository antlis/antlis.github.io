<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Living-room home server architecture</title>
  <desc id="desc">Phone and laptop control a ThinkPad T460s home server through Telegram, private mesh, NFS, nginx services, and mpv playback to a TV.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#7dd3fc"/>
    </marker>
    <style>
      .card{fill:url(#panel);stroke:#334155;stroke-width:2;filter:url(#shadow)}
      .soft{fill:#0b1220;stroke:#263244;stroke-width:2}
      .title{font:700 32px Inter,Arial,sans-serif;fill:#f8fafc}
      .subtitle{font:500 16px Inter,Arial,sans-serif;fill:#94a3b8}
      .label{font:700 20px Inter,Arial,sans-serif;fill:#f8fafc}
      .small{font:500 14px Inter,Arial,sans-serif;fill:#cbd5e1}
      .tiny{font:600 12px Inter,Arial,sans-serif;fill:#93c5fd;text-transform:uppercase;letter-spacing:.08em}
      .wire{fill:none;stroke:#7dd3fc;stroke-width:4;stroke-linecap:round;stroke-dasharray:10 10;marker-end:url(#arrow)}
      .wire2{fill:none;stroke:#86efac;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow)}
      .chip{fill:#111827;stroke:#334155;stroke-width:1.5}
      .glow{fill:url(#accent);opacity:.16}
    </style>
  </defs>

  <rect width="1200" height="760" rx="32" fill="url(#bg)"/>
  <circle class="glow" cx="590" cy="390" r="280"/>
  <circle class="glow" cx="1000" cy="160" r="170"/>

  <text x="70" y="70" class="title">Living-Room Home Server</text>
  <text x="70" y="102" class="subtitle">Old ThinkPad T460s, docking station, Telegram control, private mesh, local playback</text>

  <rect class="card" x="430" y="220" width="340" height="260" rx="22"/>
  <rect x="478" y="272" width="244" height="138" rx="10" fill="#020617" stroke="#475569" stroke-width="4"/>
  <rect x="520" y="420" width="160" height="16" rx="8" fill="#475569"/>
  <rect x="492" y="440" width="216" height="22" rx="11" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="600" y="255" text-anchor="middle" class="tiny">home server</text>
  <text x="600" y="310" text-anchor="middle" class="label">ThinkPad T460s</text>
  <text x="600" y="338" text-anchor="middle" class="small">Archcraft + Docker + user services</text>
  <text x="600" y="365" text-anchor="middle" class="small">dead touchpad, still useful</text>

  <rect class="soft" x="486" y="506" width="228" height="74" rx="18"/>
  <text x="600" y="535" text-anchor="middle" class="label">Docking Station</text>
  <text x="600" y="559" text-anchor="middle" class="small">HDMI · Ethernet · USB drives · power</text>

  <rect class="card" x="80" y="205" width="245" height="128" rx="22"/>
  <text x="202" y="245" text-anchor="middle" class="tiny">control</text>
  <text x="202" y="276" text-anchor="middle" class="label">Phone / Laptop</text>
  <text x="202" y="304" text-anchor="middle" class="small">Telegram commands, files, links</text>

  <rect class="card" x="86" y="430" width="245" height="132" rx="22"/>
  <text x="208" y="470" text-anchor="middle" class="tiny">storage access</text>
  <text x="208" y="501" text-anchor="middle" class="label">Main Laptop</text>
  <text x="208" y="529" text-anchor="middle" class="small">mounts media over NFSv4</text>

  <rect class="card" x="870" y="188" width="250" height="154" rx="22"/>
  <text x="995" y="228" text-anchor="middle" class="tiny">playback</text>
  <rect x="920" y="248" width="150" height="78" rx="8" fill="#020617" stroke="#64748b" stroke-width="4"/>
  <text x="995" y="296" text-anchor="middle" class="label">TV + mpv</text>
  <text x="995" y="323" text-anchor="middle" class="small">direct local playback, no Plex client</text>

  <rect class="card" x="860" y="418" width="270" height="156" rx="22"/>
  <text x="995" y="456" text-anchor="middle" class="tiny">media disk</text>
  <ellipse cx="995" cy="490" rx="76" ry="22" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
  <rect x="919" y="490" width="152" height="56" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
  <ellipse cx="995" cy="546" rx="76" ry="22" fill="#111827" stroke="#64748b" stroke-width="3"/>
  <text x="995" y="524" text-anchor="middle" class="label">3.6 TB HDD</text>
  <text x="995" y="556" text-anchor="middle" class="small">video · music · books · podcasts</text>

  <rect class="card" x="430" y="626" width="340" height="86" rx="22"/>
  <text x="600" y="660" text-anchor="middle" class="tiny">private web services</text>
  <text x="600" y="689" text-anchor="middle" class="label">nginx + .lab names</text>
  <text x="600" y="710" text-anchor="middle" class="small">music.lab · torrents.lab · audiobooks</text>

  <rect class="soft" x="78" y="620" width="258" height="72" rx="18"/>
  <text x="207" y="650" text-anchor="middle" class="tiny">live sources</text>
  <text x="207" y="676" text-anchor="middle" class="small">YouTube · IPTV · internet radio</text>

  <path class="wire" d="M326 268 C380 268 385 306 430 320"/>
  <text x="374" y="250" class="small">Telegram</text>

  <path class="wire2" d="M770 332 C824 316 828 287 870 274"/>
  <text x="800" y="258" class="small">HDMI / mpv</text>

  <path class="wire2" d="M770 505 C816 498 820 498 860 498"/>
  <text x="785" y="486" class="small">local files</text>

  <path class="wire" d="M331 497 C388 497 386 542 486 542"/>
  <text x="360" y="476" class="small">NFSv4</text>

  <path class="wire" d="M600 580 C600 598 600 606 600 626"/>
  <text x="620" y="612" class="small">reverse proxy</text>

  <path class="wire" d="M336 656 C384 656 388 688 430 688"/>
  <text x="354" y="635" class="small">streams</text>

  <rect class="chip" x="450" y="148" width="128" height="42" rx="21"/>
  <text x="514" y="174" text-anchor="middle" class="small">tg-mpv-bot</text>
  <rect class="chip" x="590" y="148" width="94" height="42" rx="21"/>
  <text x="637" y="174" text-anchor="middle" class="small">Deluge</text>
  <rect class="chip" x="696" y="148" width="118" height="42" rx="21"/>
  <text x="755" y="174" text-anchor="middle" class="small">Navidrome</text>
</svg>
