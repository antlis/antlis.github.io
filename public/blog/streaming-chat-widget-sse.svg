<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Blocking response vs Server-Sent Events</title>
  <desc id="desc">A comparison of two response styles. On top, a blocking request waits for the whole answer and then drops one large bubble. On the bottom, Server-Sent Events push small data delta frames one at a time, so the answer types itself out word by word and ends with a done frame.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
    <style>
      .label{font:700 22px Inter,Arial,sans-serif;fill:#e5eefb}
      .sub{font:500 15px Inter,Arial,sans-serif;fill:#94a3b8}
      .mono{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#cbd5e1}
      .monop{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#c4b5fd}
      .tiny{font:600 13px Inter,Arial,sans-serif;fill:#94a3b8}
      .box{fill:url(#panel);stroke:#334155;stroke-width:2}
      .frame{fill:#0b1220;stroke:#6d28d9;stroke-width:1.5}
      .wait{fill:none;stroke:#64748b;stroke-width:3.5;stroke-linecap:round;marker-end:url(#arrow);stroke-dasharray:6 9}
      .flow{fill:none;stroke:#a78bfa;stroke-width:3.5;stroke-linecap:round;marker-end:url(#arrowP)}
      .bubble{fill:#0f2740;stroke:#22d3ee;stroke-width:2}
    </style>
  </defs>

  <rect width="1200" height="640" rx="34" fill="url(#bg)"/>
  <line x1="72" y1="320" x2="1128" y2="320" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 10"/>

  <!-- TOP: blocking -->
  <text x="72" y="88" class="label">Blocking response</text>
  <text x="72" y="112" class="sub">one request, one big reply — the widget just spins</text>

  <g filter="url(#shadow)">
    <rect x="72" y="150" width="150" height="96" rx="18" class="box"/>
    <text x="147" y="196" text-anchor="middle" class="label">ask</text>
    <text x="147" y="222" text-anchor="middle" class="sub">POST</text>
  </g>

  <path d="M226 198 L470 198" class="wait"/>
  <text x="300" y="184" class="tiny">wait… wait… wait…</text>

  <g filter="url(#shadow)">
    <rect x="486" y="150" width="150" height="96" rx="18" class="box"/>
    <text x="561" y="196" text-anchor="middle" class="label">200 OK</text>
    <text x="561" y="222" text-anchor="middle" class="sub">full JSON</text>
  </g>

  <path d="M640 198 L708 198" class="wait" style="stroke:#a78bfa;marker-end:url(#arrowP);stroke-dasharray:none"/>

  <g filter="url(#shadow)">
    <rect x="726" y="150" width="402" height="96" rx="18" class="bubble"/>
    <text x="927" y="192" text-anchor="middle" class="mono">Anton is a senior frontend engineer who</text>
    <text x="927" y="222" text-anchor="middle" class="mono">builds homelab and AI side-projects.</text>
  </g>

  <!-- BOTTOM: SSE -->
  <text x="72" y="392" class="label">Server-Sent Events</text>
  <text x="72" y="416" class="sub">many tiny frames — the answer types itself out, like ChatGPT</text>

  <g filter="url(#shadow)">
    <rect x="72" y="452" width="150" height="96" rx="18" class="box"/>
    <text x="147" y="498" text-anchor="middle" class="label">ask</text>
    <text x="147" y="524" text-anchor="middle" class="sub">POST</text>
  </g>

  <path d="M226 500 L268 500" class="flow"/>

  <!-- delta frames -->
  <g filter="url(#shadow)">
    <rect x="278" y="470" width="176" height="60" rx="14" class="frame"/>
    <text x="366" y="497" text-anchor="middle" class="monop">data: {"delta":</text>
    <text x="366" y="518" text-anchor="middle" class="monop">"Anton "}</text>
  </g>
  <path d="M456 500 L474 500" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="484" y="470" width="176" height="60" rx="14" class="frame"/>
    <text x="572" y="497" text-anchor="middle" class="monop">data: {"delta":</text>
    <text x="572" y="518" text-anchor="middle" class="monop">"is a "}</text>
  </g>
  <path d="M662 500 L680 500" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="690" y="470" width="176" height="60" rx="14" class="frame"/>
    <text x="778" y="497" text-anchor="middle" class="monop">data: {"delta":</text>
    <text x="778" y="518" text-anchor="middle" class="monop">"senior "}</text>
  </g>
  <path d="M868 500 L886 500" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="896" y="470" width="150" height="60" rx="14" fill="#0b1220" stroke="#15803d" stroke-width="1.5"/>
    <text x="971" y="497" text-anchor="middle" style="font:600 14px ui-monospace,monospace;fill:#86efac">data:</text>
    <text x="971" y="518" text-anchor="middle" style="font:600 14px ui-monospace,monospace;fill:#86efac">{"done"}</text>
  </g>

  <!-- typing hint -->
  <text x="278" y="576" class="sub">bubble grows: “Anton” → “Anton is a” → “Anton is a senior…”</text>
</svg>
