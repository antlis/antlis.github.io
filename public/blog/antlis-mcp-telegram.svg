      <stop offset="0%" style="stop-color:#0c1a2e"/>
      <stop offset="100%" style="stop-color:#162032"/>
    </linearGradient>
  </defs>
  <rect width="460" height="380" fill="url(#bg4)" rx="8"/>

  <!-- Telegram -->
  <rect x="110" y="30" width="240" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="230" y="52" font-family="system-ui, sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="600">Telegram</text>
  <text x="230" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">user sends message</text>

  <line x1="230" y1="80" x2="230" y2="112" stroke="#f59e0b" stroke-width="1.5"/>
  <polygon points="225,110 230,118 235,110" fill="#f59e0b"/>

  <!-- AI bot -->
  <rect x="110" y="120" width="240" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
