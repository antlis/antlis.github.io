  <text x="230" y="160" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Hermes + LLM</text>

  <line x1="230" y1="170" x2="230" y2="202" stroke="#f59e0b" stroke-width="1.5"/>
  <polygon points="225,200 230,208 235,200" fill="#f59e0b"/>
  <rect x="242" y="184" width="40" height="16" rx="3" fill="#1e293b"/>
  <text x="262" y="195" font-family="monospace" font-size="9" fill="#f59e0b" text-anchor="middle">MCP</text>

  <!-- antlis-mcp -->
  <rect x="110" y="210" width="240" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="230" y="232" font-family="system-ui, sans-serif" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="700">antlis-mcp</text>
  <text x="230" y="250" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Vercel Function</text>

  <line x1="230" y1="260" x2="230" y2="292" stroke="#f59e0b" stroke-width="1.5"/>
