<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#f59e0b" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="50" y1="0" x2="50" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="350" y1="0" x2="350" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="550" y1="0" x2="550" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="650" y1="0" x2="650" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="750" y1="0" x2="750" y2="500"/>
  </g>

  <!-- Terminal window -->
  <rect x="80" y="60" width="640" height="380" rx="10" fill="#111827" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>

  <!-- Title bar -->
  <rect x="80" y="60" width="640" height="36" rx="10" fill="#1e293b"/>
  <rect x="80" y="86" width="640" height="10" fill="#1e293b"/>

  <!-- Traffic lights -->
  <circle cx="104" cy="78" r="5" fill="#ef4444"/>
  <circle cx="122" cy="78" r="5" fill="#eab308"/>
  <circle cx="140" cy="78" r="5" fill="#22c55e"/>

  <!-- Title text -->
  <text x="400" y="82" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">antlis-mcp — MCP server</text>

  <!-- Flow content area -->
  <g transform="translate(0, 14)">

    <!-- GitHub box -->
    <rect x="120" y="100" width="160" height="52" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="200" y="122" font-family="monospace" font-size="13" fill="#f8fafc" text-anchor="middle" font-weight="bold">GitHub</text>
    <text x="200" y="140" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">antlis.github.io</text>

    <!-- Arrow down from GitHub -->
    <line x1="200" y1="152" x2="200" y2="185" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="195,183 200,192 205,183" fill="#f59e0b"/>
    <text x="218" y="175" font-family="monospace" font-size="10" fill="#f59e0b">MDX files</text>

    <!-- antlis-mcp box (highlighted) -->
    <rect x="120" y="194" width="160" height="60" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="120" y="194" width="160" height="60" rx="6" fill="url(#glow)" opacity="0.5"/>
    <text x="200" y="218" font-family="monospace" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="bold" filter="url(#glow-filter)">antlis-mcp</text>
    <text x="200" y="238" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">Vercel Function</text>

    <!-- Arrow down from MCP -->
    <line x1="200" y1="254" x2="200" y2="287" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="195,285 200,294 205,285" fill="#f59e0b"/>
    <text x="218" y="278" font-family="monospace" font-size="10" fill="#f59e0b">MCP</text>

    <!-- AI Agent box -->
    <rect x="120" y="296" width="160" height="52" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="200" y="318" font-family="monospace" font-size="13" fill="#f8fafc" text-anchor="middle" font-weight="bold">AI Agent</text>
    <text x="200" y="336" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">Claude / ChatGPT</text>

    <!-- Right side: Tools panel -->
    <rect x="400" y="100" width="280" height="248" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="540" y="124" font-family="monospace" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="bold">TOOLS</text>

    <!-- Tool items -->
    <g font-family="monospace" font-size="12">
      <rect x="420" y="140" width="240" height="28" rx="4" fill="#111827"/>
      <text x="436" y="158" fill="#22c55e">about_me</text>
      <text x="646" y="158" fill="#475569" text-anchor="end">info</text>

      <rect x="420" y="176" width="240" height="28" rx="4" fill="#111827"/>
      <text x="436" y="194" fill="#22c55e">search_projects</text>
      <text x="646" y="194" fill="#475569" text-anchor="end">find</text>

      <rect x="420" y="212" width="240" height="28" rx="4" fill="#111827"/>
      <text x="436" y="230" fill="#22c55e">get_project</text>
      <text x="646" y="230" fill="#475569" text-anchor="end">detail</text>

      <rect x="420" y="248" width="240" height="28" rx="4" fill="#111827"/>
      <text x="436" y="266" fill="#22c55e">search_blog</text>
      <text x="646" y="266" fill="#475569" text-anchor="end">find</text>

      <rect x="420" y="284" width="240" height="28" rx="4" fill="#111827"/>
      <text x="436" y="302" fill="#22c55e">get_article</text>
      <text x="646" y="302" fill="#475569" text-anchor="end">detail</text>
    </g>

    <!-- Connecting line from MCP to tools -->
    <line x1="280" y1="224" x2="400" y2="224" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

    <!-- Bottom prompt -->
    <text x="400" y="390" font-family="monospace" font-size="11" fill="#475569" text-anchor="middle">$ search_projects("React")</text>

  </g>
</svg>
