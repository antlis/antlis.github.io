<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Streaming chat widget architecture</title>
  <desc id="desc">The browser chat widget POSTs messages to a Vercel serverless function api/stream.ts. That function runs a tool-calling loop against OpenRouter, which calls read-only portfolio data tools, then streams the final answer back to the browser as Server-Sent Events. A non-streaming api/chat endpoint remains as a fallback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
    <style>
      .label{font:700 24px Inter,Arial,sans-serif;fill:#e5eefb}
      .sub{font:500 15px Inter,Arial,sans-serif;fill:#94a3b8}
      .mono{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#cbd5e1}
      .tiny{font:600 13px Inter,Arial,sans-serif;fill:#7dd3fc}
      .tinyp{font:600 13px Inter,Arial,sans-serif;fill:#c4b5fd}
      .box{fill:url(#panel);stroke:#334155;stroke-width:2}
      .chip{fill:#0b1220;stroke:#1e40af;stroke-width:1.5}
      .line{fill:none;stroke:#22d3ee;stroke-width:3.5;stroke-linecap:round;marker-end:url(#arrow)}
      .return{fill:none;stroke:#a78bfa;stroke-width:3.5;stroke-linecap:round;marker-end:url(#arrowP)}
      .dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:7 8;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="640" rx="34" fill="url(#bg)"/>

  <!-- Browser -->
  <g filter="url(#shadow)">
    <rect x="58" y="196" width="252" height="196" rx="22" class="box"/>
    <rect x="86" y="228" width="196" height="30" rx="8" fill="#111827" stroke="#475569" stroke-width="1.5"/>
    <circle cx="100" cy="243" r="4" fill="#ff5f57"/><circle cx="114" cy="243" r="4" fill="#febc2e"/><circle cx="128" cy="243" r="4" fill="#28c840"/>
    <text x="184" y="219" text-anchor="middle" class="label">Browser</text>
    <text x="184" y="286" text-anchor="middle" class="sub">ChatWidget.astro</text>
    <rect x="86" y="302" width="196" height="34" rx="12" class="chip"/>
    <text x="184" y="325" text-anchor="middle" class="mono">fetch + getReader()</text>
    <rect x="86" y="344" width="196" height="34" rx="12" class="chip"/>
    <text x="184" y="367" text-anchor="middle" class="mono">marked + DOMPurify</text>
  </g>

  <!-- api/stream -->
  <g filter="url(#shadow)">
    <rect x="452" y="150" width="296" height="340" rx="24" class="box"/>
    <rect x="486" y="186" width="228" height="56" rx="14" fill="#111827" stroke="#475569" stroke-width="2"/>
    <text x="600" y="222" text-anchor="middle" class="label">api/stream.ts</text>
    <text x="600" y="270" text-anchor="middle" class="sub">Vercel serverless function</text>
    <rect x="488" y="292" width="224" height="40" rx="13" class="chip"/>
    <text x="600" y="318" text-anchor="middle" class="mono">text/event-stream</text>
    <rect x="488" y="342" width="224" height="40" rx="13" class="chip"/>
    <text x="600" y="368" text-anchor="middle" class="mono">tool loop ×5</text>
    <rect x="488" y="392" width="224" height="40" rx="13" class="chip"/>
    <text x="600" y="418" text-anchor="middle" class="mono">openrouter/free</text>
  </g>

  <!-- OpenRouter -->
  <g filter="url(#shadow)">
    <rect x="892" y="104" width="250" height="168" rx="22" class="box"/>
    <text x="1017" y="150" text-anchor="middle" class="label">OpenRouter</text>
    <text x="1017" y="180" text-anchor="middle" class="sub">LLM · OpenAI-compatible</text>
    <rect x="922" y="204" width="190" height="40" rx="13" class="chip"/>
    <text x="1017" y="230" text-anchor="middle" class="mono">stream: true</text>
  </g>

  <!-- Portfolio data -->
  <g filter="url(#shadow)">
    <rect x="892" y="360" width="250" height="212" rx="22" class="box"/>
    <text x="1017" y="404" text-anchor="middle" class="label">Portfolio data</text>
    <text x="1017" y="432" text-anchor="middle" class="sub">read-only · same Git repo</text>
    <rect x="922" y="448" width="190" height="34" rx="11" class="chip"/>
    <text x="1017" y="471" text-anchor="middle" class="mono">about_me</text>
    <rect x="922" y="490" width="190" height="34" rx="11" class="chip"/>
    <text x="1017" y="513" text-anchor="middle" class="mono">search_projects</text>
    <rect x="922" y="532" width="190" height="34" rx="11" class="chip"/>
    <text x="1017" y="555" text-anchor="middle" class="mono">get_article</text>
  </g>

  <!-- fallback chip -->
  <g filter="url(#shadow)">
    <rect x="452" y="524" width="296" height="56" rx="16" fill="#0b1220" stroke="#334155" stroke-width="2" stroke-dasharray="7 8"/>
    <text x="600" y="558" text-anchor="middle" class="sub">api/chat · non-streaming fallback</text>
  </g>

  <!-- Browser -> api/stream -->
  <path d="M312 268 C380 250 410 235 450 224" class="line"/>
  <text x="366" y="238" class="tiny">POST messages[]</text>

  <!-- api/stream -> OpenRouter -->
  <path d="M750 214 C815 200 845 195 890 190" class="line"/>
  <text x="770" y="185" class="tiny">chat + tools</text>

  <!-- OpenRouter <-> Portfolio (loop) -->
  <path d="M990 272 L990 356" class="line"/>
  <text x="878" y="322" class="tiny" text-anchor="end">tool_calls</text>
  <path d="M1050 356 L1050 272" class="return"/>
  <text x="1160" y="322" class="tinyp" text-anchor="end">results</text>

  <!-- OpenRouter -> api/stream (content deltas back) -->
  <path d="M890 244 C842 262 812 268 752 274" class="return"/>
  <text x="812" y="292" class="tinyp">content deltas</text>

  <!-- api/stream -> Browser (SSE) -->
  <path d="M450 330 C408 340 372 348 314 356" class="return"/>
  <text x="330" y="392" class="tinyp">data: {"type":"delta"}</text>

  <!-- fallback dashed -->
  <path d="M230 392 C300 470 380 540 448 552" class="dash"/>
  <text x="250" y="470" class="sub">if stream fails</text>
</svg>
